name: Publish to PyPI

# Publishes on a GitHub Release via PyPI Trusted Publishing (OIDC) -- no API token stored.
# One-time setup on PyPI: https://pypi.org/manage/account/publishing/
#   project name: bitbudget | owner: sjmoran | repo: bitbudget | workflow: publish.yml

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # required for trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
